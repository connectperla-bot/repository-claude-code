services:
  - type: web
    name: perla-upload-endpoint
    runtime: node
    plan: free
    rootDir: scripts
    buildCommand: npm install
    startCommand: node perla-upload-endpoint.js
    envVars:
      - key: PRINTIFY_API_KEY
        sync: false
      - key: PRINTIFY_SHOP_ID
        value: "27790439"
      # ROUND 39 -- era "*", cioe' chiunque da qualunque sito.
      - key: ALLOWED_ORIGIN
        value: "https://perlaitaly.com"
      - key: RATE_MAX_AL_MINUTO
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "10"
      # Printful (fornitore EU per collare_eu/bandana_eu/ciotola_eu/
      # guinzaglio_eu): servono solo per /generate-mockup su questi 4 tipi
      # (vedi PRINTFUL_MOCKUP_CONFIG in perla-upload-endpoint.js). Stessi
      # valori gia' in uso nel servizio perla-printify-order-sync qui sotto.
      - key: PRINTFUL_API_KEY
        sync: false
      - key: PRINTFUL_STORE_ID
        value: "18346388"
      - key: PRINTFUL_COLLARE_EU_VARIANT_ID
        value: "19186"
      - key: PRINTFUL_BANDANA_EU_VARIANT_ID
        value: "16031"
      - key: PRINTFUL_CIOTOLA_EU_VARIANT_ID
        value: "16785"
      - key: PRINTFUL_GUINZAGLIO_EU_VARIANT_ID
        value: "19126"
      # Cloudinary: ospita il composito finale a piena risoluzione (Printify
      # preview_url tronca a 1200px, che diventava anche il file usato per
      # la stampa reale su Printful). Se mancano, /upload ricade sul preview
      # Printify come prima, nessun rischio per il deploy.
      - key: CLOUDINARY_CLOUD_NAME
        value: "qarb7ouo"
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: COLLARE_BLUEPRINT_ID
        value: "784"
      - key: COLLARE_PROVIDER_ID
        value: "93"
      - key: COLLARE_VARIANT_ID
        value: "74897"
      - key: BANDANA_BLUEPRINT_ID
        value: "562"
      - key: BANDANA_PROVIDER_ID
        value: "70"
      - key: BANDANA_VARIANT_ID
        value: "101403"
      - key: MEDAGLIETTA_BLUEPRINT_ID
        value: "566"
      - key: MEDAGLIETTA_PROVIDER_ID
        value: "70"
      - key: MEDAGLIETTA_VARIANT_ID
        value: "70870"
      - key: CIOTOLA_BLUEPRINT_ID
        value: "570"
      - key: CIOTOLA_PROVIDER_ID
        value: "70"
      - key: CIOTOLA_VARIANT_ID
        value: "71135"
      - key: CUCCIA_BLUEPRINT_ID
        value: "419"
      - key: CUCCIA_PROVIDER_ID
        value: "10"
      - key: CUCCIA_VARIANT_ID
        value: "61436"
      - key: TAPPETINO_BLUEPRINT_ID
        value: "855"
      - key: TAPPETINO_PROVIDER_ID
        value: "70"
      - key: TAPPETINO_VARIANT_ID
        value: "76892"
      - key: GUINZAGLIO_BLUEPRINT_ID
        value: "2791"
      - key: GUINZAGLIO_PROVIDER_ID
        value: "80"
      - key: GUINZAGLIO_VARIANT_ID
        value: "150707"

  - type: web
    name: perla-printify-order-sync
    runtime: node
    plan: free
    rootDir: scripts
    buildCommand: npm install
    startCommand: node perla-printify-order-sync.js
    envVars:
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      # ROUND 45 -- opzionali, ma sono l'unico modo perche' un'evasione
      # fallita si veda. Senza, l'unica traccia e' un console.error su un
      # servizio di piano gratuito i cui log non sono conservati: l'ordine
      # resta non evaso finche' non scrive il cliente. Con questi due, la riga
      # che non parte mette un tag "evasione-fallita" e una nota sull'ordine,
      # nel pannello che si apre comunque ogni giorno.
      # Il token si crea in Impostazioni > App e canali di vendita > Sviluppa
      # app, con il solo permesso write_orders.
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        value: "1p1st1-n4.myshopify.com"
      - key: PRINTIFY_API_KEY
        sync: false
      - key: PRINTIFY_SHOP_ID
        value: "27790439"
      - key: PERLA_LOGO_IMAGE_ID
        sync: false
      # ROUND 45 -- mancava su QUESTO servizio (era solo sul gemello
      # perla-upload-endpoint). providers/printful-client.js la usa per
      # ricostruire l'URL del composito a piena risoluzione: senza, ripiegava
      # sulla copia Printify TRONCATA A 1200px, e il file di stampa EU usciva
      # a un settimo dei pixel nativi -- esattamente il difetto che ROUND 23 e
      # ROUND 44 dovevano chiudere, e senza nemmeno un log che lo dicesse.
      - key: CLOUDINARY_CLOUD_NAME
        value: "qarb7ouo"
      # Printful (collare_eu/bandana_eu, prodotti nuovi e distinti dal
      # collare/bandana Printify — vedi scripts/provider-router.js e
      # scripts/providers/printful-client.js). Senza PRINTFUL_API_KEY il
      # router usa sempre Printify, nessun rischio per gli ordini esistenti.
      - key: PRINTFUL_API_KEY
        sync: false
      - key: PRINTFUL_STORE_ID
        value: "18346388"
      - key: PRINTFUL_COLLARE_EU_VARIANT_ID
        value: "19186"
      - key: PRINTFUL_BANDANA_EU_VARIANT_ID
        value: "16031"
      # ROUND 33 -- mancavano su QUESTO servizio (gia' presenti sul gemello
      # perla-upload-endpoint qui sopra, che le usa solo per /generate-mockup):
      # senza queste due, un ordine EU reale per ciotola_eu/guinzaglio_eu
      # veniva instradato a Printful da provider-router.js ma falliva alla
      # creazione ordine per variantId mancante (0) -- vedi providers/printful-client.js.
      - key: PRINTFUL_CIOTOLA_EU_VARIANT_ID
        value: "16785"
      - key: PRINTFUL_GUINZAGLIO_EU_VARIANT_ID
        value: "19126"
      - key: COLLARE_BLUEPRINT_ID
        value: "784"
      - key: COLLARE_PROVIDER_ID
        value: "93"
      - key: COLLARE_VARIANT_ID
        value: "74897"
      - key: BANDANA_BLUEPRINT_ID
        value: "562"
      - key: BANDANA_PROVIDER_ID
        value: "70"
      - key: BANDANA_VARIANT_ID
        value: "101403"
      - key: MEDAGLIETTA_BLUEPRINT_ID
        value: "566"
      - key: MEDAGLIETTA_PROVIDER_ID
        value: "70"
      - key: MEDAGLIETTA_VARIANT_ID
        value: "70870"
      - key: CIOTOLA_BLUEPRINT_ID
        value: "570"
      - key: CIOTOLA_PROVIDER_ID
        value: "70"
      - key: CIOTOLA_VARIANT_ID
        value: "71135"
      - key: CUCCIA_BLUEPRINT_ID
        value: "419"
      - key: CUCCIA_PROVIDER_ID
        value: "10"
      - key: CUCCIA_VARIANT_ID
        value: "61436"
      - key: TAPPETINO_BLUEPRINT_ID
        value: "855"
      - key: TAPPETINO_PROVIDER_ID
        value: "70"
      - key: TAPPETINO_VARIANT_ID
        value: "76892"
      - key: GUINZAGLIO_BLUEPRINT_ID
        value: "2791"
      - key: GUINZAGLIO_PROVIDER_ID
        value: "80"
      - key: GUINZAGLIO_VARIANT_ID
        value: "150707"

  - type: web
    name: perla-assistant-bot
    runtime: node
    plan: free
    rootDir: scripts
    buildCommand: npm install
    startCommand: node perla-assistant-bot.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # ROUND 39 -- era "*", cioe' chiunque da qualunque sito.
      - key: ALLOWED_ORIGIN
        value: "https://perlaitaly.com"
      # dieci domande al minuto sono piu' di quante ne faccia una persona
      - key: RATE_MAX_AL_MINUTO
        value: "10"
